name: Academy Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: academy-pages-main
  cancel-in-progress: false

jobs:
  verify-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard-index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      CODEARBITER_SOURCE_SHA: debb49da71aa1b97bca0988f72e46bb5875a23e3
      CODEARBITER_TASKWRITE: ${{ github.workspace }}/.ci/codearbiter-source/core/pysrc/taskwrite.py
      WORKSHOP_QUEUE_TEST_WHEELHOUSE: ${{ github.workspace }}/.github/wheelhouse
    steps:
      - name: Check out the exact reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned local CodeArbiter source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arbiterForge/codeArbiter
          ref: debb49da71aa1b97bca0988f72e46bb5875a23e3
          path: .ci/codearbiter-source
          persist-credentials: false

      - name: Remove checkout-only Git configuration
        run: git config --local --unset-all gc.auto

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify pinned hosted prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/codearbiter-source rev-parse HEAD)" = "$CODEARBITER_SOURCE_SHA"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          wheel = Path(".github/wheelhouse/setuptools-83.0.0-py3-none-any.whl")
          assert wheel.stat().st_size == 1008090
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == "29b23c360f22f414dc7336bb39178cc7bcbf6021ed2733cde173f09dba19abb3"
          PY

      - name: Run one exhaustive milestone shard
        timeout-minutes: 75
        run: python scripts/run_test_shards.py --shard-index "${{ matrix.shard-index }}"

  build:
    if: github.ref == 'refs/heads/main'
    needs: verify-main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check Python indentation
        run: python -m tabnanny academy_engine scripts tests workshop_queue

      - name: Compile Python sources
        run: python -m compileall -q academy_engine scripts tests workshop_queue

      - name: Verify project state
        run: python -m unittest tests.test_project_state -v

      - name: Select Node 22.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          check-latest: false

      - name: Verify Academy browser controls
        run: node --test tests/site/academy.test.mjs

      - name: Build the Academy site
        run: >-
          python scripts/build_preview_site.py
          --output site/generated
          --release-sha "$CANDIDATE_SHA"

      - name: Check the generated site
        run: python scripts/check_preview_site.py site/generated

      - name: Scan every tracked file for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_root="$RUNNER_TEMP/academy-secret-scan"
          mkdir -p "$scan_root"
          object_format="$(git -C "$GITHUB_WORKSPACE" rev-parse --show-object-format)"
          git -C "$scan_root" init --quiet --object-format="$object_format"
          git -C "$GITHUB_WORKSPACE" ls-tree -r -z HEAD |
            while IFS= read -r -d '' entry; do
              metadata="${entry%%$'\t'*}"
              path="${entry#*$'\t'}"
              read -r mode object_type object_id <<< "$metadata"
              if [[ "$mode" == "160000" ]]; then
                continue
              fi
              if [[ "$object_type" != "blob" ]]; then
                echo "ERROR: unexpected non-blob tree entry." >&2
                exit 2
              fi
              imported="$({
                git -C "$GITHUB_WORKSPACE" cat-file blob "$object_id"
              } | git -C "$scan_root" hash-object -w --stdin)"
              if [[ "$imported" != "$object_id" ]]; then
                echo "ERROR: reconstructed blob identity mismatch." >&2
                exit 2
              fi
              git -C "$scan_root" update-index --add \
                --cacheinfo "$mode,$object_id,$path"
            done
          (
            cd "$scan_root"
            python "$GITHUB_WORKSPACE/scripts/scan_secrets.py" --staged
          )

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/generated

  verify-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      verified: ${{ steps.release-assets.outputs.verified }}
    env:
      RELEASE_TAG: preview-0.22
      RELEASE_EPOCH: 1786665600
      CANDIDATE_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact Pages candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select release-builder Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify immutable Preview release assets
        id: release-assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/academy-release"
          mkdir -p "$release_dir"
          cd "$release_dir"

          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          release_ready=false
          for attempt in {1..30}; do
            http_status="$(curl --disable --silent --show-error --location \
              --proto "=https" --proto-redir "=https" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --output release.json.pending --write-out '%{http_code}' \
              "$release_api")"
            if [[ "$http_status" == 200 ]]; then
              mv release.json.pending release.json
              if python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = (
              "install.ps1",
              "install.ps1.sha256",
              "install.sh",
              "install.sh.sha256",
              "arbiter-academy-preview-0.22.zip",
              "arbiter-academy-preview-0.22.zip.sha256",
          )
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("release tag mismatch")
          if release.get("immutable") is not True:
              raise SystemExit("release is not immutable")
          if release.get("draft") is not False:
              raise SystemExit("release is still a draft")
          if not isinstance(release.get("published_at"), str) or not release["published_at"]:
              raise SystemExit("release is not published")
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("release assets are missing")
          names = []
          for asset in assets:
              if not isinstance(asset, dict) or not isinstance(asset.get("name"), str):
                  raise SystemExit("release asset metadata is malformed")
              names.append(asset["name"])
          if len(names) != len(expected) or sorted(names) != sorted(expected):
              raise SystemExit("release asset inventory mismatch")
          by_name = {}
          for asset in assets:
              name = asset["name"]
              asset_id = asset.get("id")
              if type(asset_id) is not int or asset_id <= 0:
                  raise SystemExit("release asset ID is invalid")
              if asset.get("state") != "uploaded":
                  raise SystemExit("release asset is not published")
              expected_url = (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                  f"{os.environ['RELEASE_TAG']}/{name}"
              )
              if asset.get("browser_download_url") != expected_url:
                  raise SystemExit("release asset public URL mismatch")
              by_name[name] = asset_id
          Path("assets.tsv").write_text(
              "".join(f"{name}\t{by_name[name]}\n" for name in expected),
              encoding="utf-8",
          )
          PY
              then
                release_ready=true
                break
              fi
            elif [[ "$http_status" != 404 ]]; then
              echo "ERROR: release API returned HTTP ${http_status}." >&2
              exit 1
            fi
            rm -f release.json.pending release.json assets.tsv
            if [[ "$attempt" -lt 30 ]]; then
              sleep 60
            fi
          done
          test "$release_ready" = true

          # Resolve the release tag to its target commit SHA before trusting assets.
          tag_rows="$(git ls-remote --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          resolved_sha="$(printf '%s\n' "$tag_rows" | awk -v tag="refs/tags/${RELEASE_TAG}^{}" '$2 == tag { print $1 }')"
          if [[ -z "$resolved_sha" ]]; then
            resolved_sha="$(printf '%s\n' "$tag_rows" | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { print $1 }')"
          fi
          [[ "$resolved_sha" =~ ^[0-9a-f]{40}$ ]]
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$resolved_sha"
          if [[ "$resolved_sha" != "$CANDIDATE_SHA" ]]; then
            echo "ERROR: immutable release tag does not match the exact Pages candidate." >&2
            exit 1
          fi
          release_source="$RUNNER_TEMP/academy-release-source"
          git -C "$GITHUB_WORKSPACE" worktree add --detach "$release_source" "$resolved_sha"
          test "$(git -C "$release_source" rev-parse HEAD)" = "$resolved_sha"

          public_dir="$RUNNER_TEMP/academy-public-release"
          mkdir -p "$public_dir"
          while IFS=$'\t' read -r asset_name asset_id; do
            case "$asset_name" in
              install.ps1|install.ps1.sha256|install.sh|install.sh.sha256|arbiter-academy-preview-0.22.zip|arbiter-academy-preview-0.22.zip.sha256) ;;
              *) echo "ERROR: unexpected release asset name." >&2; exit 1 ;;
            esac
            asset_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            curl --disable --fail-with-body --silent --show-error --location \
              --proto "=https" --proto-redir "=https" \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              "$asset_api" --output "$asset_name"
            public_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
            curl --disable --fail-with-body --silent --show-error --location \
              --proto "=https" --proto-redir "=https" \
              "$public_url" --output "$public_dir/$asset_name"
            cmp --silent "$asset_name" "$public_dir/$asset_name"
          done < assets.tsv

          python - <<'CHECKSUMS'
          import re
          from pathlib import Path

          checksum_targets = {
              "install.ps1.sha256": "install.ps1",
              "install.sh.sha256": "install.sh",
              "arbiter-academy-preview-0.22.zip.sha256": "arbiter-academy-preview-0.22.zip",
          }
          checksum_pattern = re.compile(rb"[0-9a-f]{64}  ([A-Za-z0-9._-]+)\n")
          for manifest, target in checksum_targets.items():
              match = checksum_pattern.fullmatch(Path(manifest).read_bytes())
              if match is None or match.group(1).decode("ascii") != target:
                  raise SystemExit(f"non-canonical checksum manifest: {manifest}")
          CHECKSUMS

          sha256sum --check install.ps1.sha256
          sha256sum --check install.sh.sha256
          sha256sum --check arbiter-academy-preview-0.22.zip.sha256

          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          reproduced_dir="$RUNNER_TEMP/academy-reproduced-release"
          mkdir -p "$reproduced_dir"
          python "$release_source/scripts/build_release_assets.py" \
            --source "$release_source" \
            --output "$reproduced_dir" \
            --epoch "$RELEASE_EPOCH" \
            --release "$RELEASE_TAG"
          while IFS=$'\t' read -r asset_name asset_id; do
            cmp --silent "$asset_name" "$reproduced_dir/$asset_name"
            cmp --silent "$public_dir/$asset_name" "$reproduced_dir/$asset_name"
          done < assets.tsv
          echo "verified=true" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main' && needs.verify-release.outputs.verified == 'true'
    needs: [build, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
