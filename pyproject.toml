[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-queue"
version = "0.1.0"
description = "A local-first workshop ticket queue for Arbiter Academy labs."
requires-python = ">=3.11"
license = "AGPL-3.0-only"

[project.scripts]
workshop-queue = "workshop_queue.cli:main"
arbiter-academy = "academy_engine.cli:main"

[tool.setuptools]
packages = ["workshop_queue", "academy_engine"]

[tool.setuptools.package-data]
workshop_queue = ["seed/tickets.json"]

[tool.setuptools.data-files]
"share/arbiter-academy/academy" = [
  "academy/catalog.json",
  "academy/catalog.schema.json",
  "academy/checkpoint.schema.json",
  "academy/contracts.json",
  "academy/receipt.schema.json",
  "academy/scenario.schema.json",
]
"share/arbiter-academy/academy/checkpoints" = ["academy/checkpoints/*.json"]
"share/arbiter-academy/academy/publication" = ["academy/publication/preview-0.1.json"]
"share/arbiter-academy/academy/candidates/P04-review-a-dependency" = [
  "academy/candidates/P04-review-a-dependency/candidate-set.json",
  "academy/candidates/P04-review-a-dependency/python_dateutil-2.9.0.post0-py2.py3-none-any.whl",
  "academy/candidates/P04-review-a-dependency/six-1.17.0-py2.py3-none-any.whl",
  "academy/candidates/P04-review-a-dependency/python_dateutil-2.9.0.post0.LICENSE",
  "academy/candidates/P04-review-a-dependency/six-1.17.0.LICENSE",
  "academy/candidates/P04-review-a-dependency/Apache-2.0.txt",
]
"share/arbiter-academy/academy/tracks/foundations" = [
  "academy/tracks/foundations/index.md",
  "academy/tracks/foundations/F01-fork-clone-doctor.md",
  "academy/tracks/foundations/F02-orient-to-state.md",
  "academy/tracks/foundations/F03-work-the-board.md",
  "academy/tracks/foundations/F04-fix-with-evidence.md",
]
"share/arbiter-academy/academy/tracks/practitioner" = [
  "academy/tracks/practitioner/index.md",
